pre-commit:
  parallel: true
  commands:
    format-go:
      glob: "*.go"
      run: |
        files=$(git diff --name-only --cached --diff-filter=ACMR -- '*.go')
        [ -z "$files" ] && exit 0
        bad=$(gofmt -l $files)
        if [ -n "$bad" ]; then
          echo "gofmt needed on:"
          echo "$bad"
          echo "fix: gofmt -w <files>"
          exit 1
        fi
    api-check:
      glob: "{api/**,gen/**,go/client/**,ts/src/**,rust/src/**}"
      run: make api-check
    proto-check:
      glob: "{api/proto/**,go/wire/**,ts/src/gen/**,ts/package.json}"
      run: make proto-check
    proto-coherence:
      glob: "{api/**,gen/**}"
      run: make proto-coherence
    version-check:
      glob: "{api/**,ts/package.json,ts/package-lock.json,rust/Cargo.toml}"
      run: make version-check
    lint-go:
      glob: "{go/**/*.go,gen/**/*.go,.golangci.yml}"
      run: make go-check lint
    lint-ts:
      glob: "{ts/src/**,ts/test/**,ts/eslint.config.js,ts/package.json,ts/tsconfig.json}"
      run: make ts-check ts-lint
    lint-rust:
      glob: "{rust/**/*.rs,rust/Cargo.toml,rust/rustfmt.toml}"
      run: make rust-fmt rust-check

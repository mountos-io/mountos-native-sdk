# mountOS native filesystem API. Source of truth for wire types,
# operation IDs, and error codes. Generated code must not be edited.
#
# Rules:
#   - Operation IDs and field IDs are permanent. Never reuse or renumber.
#     Removed entries go under `reserved`.
#   - Field notation per field: `{id: N, type: T, required: bool}`.
#   - Types: bool, uint32, uint64, int64, bytes, string, enum name,
#     message name, or `repeated <type>`.
#   - Kinds:
#       unary         one request message, one response message.
#       data_request  request message, then raw payload bytes (not Protobuf).
#       data_response response message, then raw payload bytes (not Protobuf).
#       server_stream one request, many response messages until end or cancel.
#   - Raw payload length is bounded by `maxPayloadBytes`. Its size is
#     carried in the frame header, not in the message.

# Versioning (backward compatible within a major version):
#   - Major version changes only for wire breaks. A client of major N
#     talks to any server of major N.
#   - Minor additions only: new operations with new IDs, new optional
#     fields with new field IDs, new enum values, new capabilities.
#   - Clients ignore unknown fields, unknown enum values, and unknown
#     operations. Servers ignore unknown optional fields.
#   - New behavior is gated by a capability. Hello negotiates the
#     intersection. A required capability the server lacks fails the call
#     with UNSUPPORTED_OPERATION, not a silent fallback.
#   - Removing or changing an existing field, type, or meaning needs a
#     major bump. Removed IDs stay under `reserved` forever.

api: mountos.filesystem
version: 1
minorVersion: 9

endpoint:
  # One socket per mount: <home>/.mountOS/sockets/mountos_api_<hash>.sock, where <hash> is the
  # first 8 bytes of the SHA-256 of the mount path in hex. A long path falls back to a private
  # per-user temp directory.
  socketPath: .mountOS/sockets/mountos_api_<hash>.sock
  transport: unix_stream
  frameMagic: "MFS1"
  maxFrameBytes: 16777216
  maxPayloadBytes: 8388608

# Handshake gates every connection. Unknown required capabilities fail negotiation.
capabilities:
  - bulk_io
  - ls_stat
  - remove_all
  - watch
  - warm
  - pipelining
  - clone
  - ops

# Pipelining. A client that sees the capability "pipelining" in the Hello reply
# may keep up to min(its own limit, max_inflight) requests outstanding on one
# connection. Without the capability, or with max_inflight 1, a client keeps one
# request in flight.
#   - Replies carry the request id and may arrive in any order, except as the
#     rules below require.
#   - Requests that name the same handle (Read, Write, Seek, ReadAt, WriteAt,
#     Fsync, Flush, Ftruncate, Fstat, Close, Readdir, Closedir, ReadBatch,
#     WriteBatch) run one at a time in arrival order. Close and Closedir are
#     barriers for their handle. A handle can be used only after the reply to
#     its Open.
#   - Path operations (Stat, Mkdir, Rename, Ls, StatBatch, Watch, Warm, Clone,
#     CloneDir, RemoveDir, OpCancel, and so on) run concurrently with everything and have no order among themselves.
#     A client that needs an order waits for the reply.
#   - A notice that a request causes is sent after the reply to that request.
#   - At the limit the server stops reading frames until a request ends.
#   - A client that stops waiting for a request marks its id abandoned and
#     discards the late reply. The connection stays usable.
#   - A failing request does not affect others. A bad frame closes the
#     connection.

enums:
  OpenFlag:
    values:
      READ_ONLY: 0
      WRITE_ONLY: 1
      READ_WRITE: 2
      CREATE: 64
      EXCL: 128
      TRUNC: 512
      APPEND: 1024
  Whence:
    values:
      SET: 0
      CUR: 1
      END: 2
  FileType:
    values:
      REGULAR: 0
      DIRECTORY: 1
      SYMLINK: 2
  # Kind of an asynchronous notice the server pushes on a connection.
  NoticeKind:
    values:
      WARM_DONE: 0      # A warm request finished.
      WARM_FAILED: 1    # A warm request failed. code and message say why.
      CLOSING: 2        # The server is about to close this connection, for example on unmount.
      OVERFLOW: 3       # Notices were dropped because the client read too slowly.
      CHANGE: 4         # A watched path changed. change_kind, path, and old_path say how.
      OP_DONE: 5        # An operation ended. ref_id is the op id. The count fields carry the totals. Terminal.
      OP_FAILED: 6      # One entry of an operation failed. ref_id is the op id. path, code, and message say which and why. Not terminal.

  # What Clone and CloneDir copy from the source besides data, mode, and owner.
  PreserveKind:
    values:
      TIMES: 0    # Keep the source times. Without it the new entry gets the current time.
      XATTR: 1    # Copy extended attributes.
      ACL: 2      # Copy access control lists.

  # What Clone did with the destination.
  CloneOutcome:
    values:
      CLONED: 0        # The destination did not exist and was created.
      OVERWRITTEN: 1   # The destination held different content and was replaced.
      SKIPPED: 2       # The destination already held the same content. Nothing changed.

  WatchEventKind:
    values:
      CREATE: 0
      REMOVE: 1
      WRITE: 2
      RENAME: 3
      ATTRIB: 4
      OVERFLOW: 5    # Queue dropped events. Client must re-list the watched path.

messages:
  HelloRequest:
    client_name: {id: 1, type: string}
    min_version: {id: 2, type: uint32, required: true}
    max_version: {id: 3, type: uint32, required: true}
    capabilities: {id: 4, type: repeated string}

  HelloResponse:
    version: {id: 1, type: uint32, required: true}
    capabilities: {id: 2, type: repeated string}
    max_payload_bytes: {id: 3, type: uint32, required: true}
    max_inflight: {id: 4, type: uint32, required: true}    # Requests the server accepts at once on one connection. Meaningful with the pipelining capability. Default 32.
    # Random per server start, never 0. Warm ids restart at 0 per server instance, so a client that sees a different value on reconnect drops its finished warm results. Absent or 0 from an older server.
    instance_id: {id: 5, type: uint64}

  FileInfo:
    name: {id: 1, type: string}
    size: {id: 2, type: int64}
    mode: {id: 3, type: uint32}
    type: {id: 4, type: FileType}
    mtime_ns: {id: 5, type: int64}
    atime_ns: {id: 6, type: int64}
    ctime_ns: {id: 7, type: int64}
    uid: {id: 8, type: uint32}
    gid: {id: 9, type: uint32}
    nlink: {id: 10, type: uint32}
    inode: {id: 11, type: uint64}

  DirEntry:
    name: {id: 1, type: string, required: true}
    type: {id: 2, type: FileType, required: true}
    info: {id: 3, type: FileInfo}    # Present for Ls. Absent for Readdir.

  Range:
    offset: {id: 1, type: int64, required: true}
    length: {id: 2, type: uint32, required: true}

  BatchItemError:
    index: {id: 1, type: uint32, required: true}
    code: {id: 2, type: string, required: true}
    message: {id: 3, type: string}

  # Asynchronous notice. ref_id is the id the call returned: the warm id for a
  # warm, the watch id for a watch, the op id for an operation. path, code, and
  # message are set where they apply. sequence increases across every notice the
  # server sends. The count fields are set only for OP_DONE. A count that is 0 may
  # be left out.
  Notice:
    kind: {id: 1, type: NoticeKind, required: true}
    sequence: {id: 2, type: uint64, required: true}
    ref_id: {id: 3, type: uint64}
    path: {id: 4, type: string}
    code: {id: 5, type: string}
    message: {id: 6, type: string}
    change_kind: {id: 7, type: WatchEventKind}   # Set for CHANGE.
    old_path: {id: 8, type: string}              # Set for a rename. path is the new name.
    cloned: {id: 9, type: uint64}                # OP_DONE: entries created.
    overwritten: {id: 10, type: uint64}          # OP_DONE: entries whose content was replaced.
    skipped: {id: 11, type: uint64}              # OP_DONE: entries that already held the same content.
    failed: {id: 12, type: uint64}               # OP_DONE: entries that failed. Can exceed the OP_FAILED notices sent.
    removed: {id: 13, type: uint64}              # OP_DONE: entries removed.
    protected: {id: 14, type: uint64}            # OP_DONE: entries kept because the mount protects them.

  # Options of Clone and CloneDir. Servers ignore fields they do not know.
  CloneOptions:
    overwrite: {id: 1, type: bool}                  # Replace the content of a destination that differs. Without it such a destination fails with EEXIST.
    preserve: {id: 2, type: "repeated PreserveKind"}

  # Error metadata carried when a frame has the error flag set.
  WireError:
    code: {id: 1, type: string, required: true}
    message: {id: 2, type: string}

  Empty: {}

operations:
  # Session
  - name: Hello
    id: 1
    kind: unary
    request: HelloRequest
    response: HelloResponse
    errors: [UNSUPPORTED_VERSION, UNSUPPORTED_OPERATION]

  - name: Ping
    id: 2
    kind: unary
    request: Empty
    response: Empty

  # Handle I/O. Handle offsets serialize per handle on the server.
  - name: Open
    id: 10
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      flags: {id: 2, type: uint32, required: true}
      mode: {id: 3, type: uint32}
    response:
      handle: {id: 1, type: uint64, required: true}
    errors: [ENOENT, EACCES, EEXIST, EISDIR, ENOTDIR, EINVAL, ELOOP, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY]

  - name: Close
    id: 11
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
    response: Empty
    errors: [EBADF]

  - name: Read
    id: 12
    kind: data_response
    request:
      handle: {id: 1, type: uint64, required: true}
      length: {id: 2, type: uint32, required: true}
    response:
      count: {id: 1, type: uint32, required: true}
    errors: [EBADF, EISDIR, EIO]

  - name: Write
    id: 13
    kind: data_request
    request:
      handle: {id: 1, type: uint64, required: true}
    response:
      count: {id: 1, type: uint32, required: true}
    errors: [EBADF, EIO, ENOSPC, EFBIG, EROFS, EDQUOT, EBUSY]

  - name: ReadAt
    id: 14
    kind: data_response
    request:
      handle: {id: 1, type: uint64, required: true}
      offset: {id: 2, type: int64, required: true}
      length: {id: 3, type: uint32, required: true}
    response:
      count: {id: 1, type: uint32, required: true}
    errors: [EBADF, EINVAL, EISDIR, EIO]

  - name: WriteAt
    id: 15
    kind: data_request
    request:
      handle: {id: 1, type: uint64, required: true}
      offset: {id: 2, type: int64, required: true}
    response:
      count: {id: 1, type: uint32, required: true}
    errors: [EBADF, EINVAL, EIO, ENOSPC, EFBIG, EROFS, EDQUOT, EBUSY]

  - name: Seek
    id: 16
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
      offset: {id: 2, type: int64, required: true}
      whence: {id: 3, type: Whence, required: true}
    response:
      offset: {id: 1, type: int64, required: true}
    errors: [EBADF, EINVAL]

  - name: Fsync
    id: 17
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
      data_only: {id: 2, type: bool}
    response: Empty
    errors: [EBADF, EIO]

  - name: Flush
    id: 18
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
    response: Empty
    errors: [EBADF, EIO]

  - name: Ftruncate
    id: 19
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
      size: {id: 2, type: int64, required: true}
    response: Empty
    errors: [EBADF, EINVAL, EIO, EFBIG, EROFS, EDQUOT, EBUSY]

  # Path metadata and namespace
  - name: Stat
    id: 20
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      info: {id: 1, type: FileInfo, required: true}
    errors: [ENOENT, EACCES, ENOTDIR, ELOOP, ENAMETOOLONG, ESTALE]

  - name: Lstat
    id: 21
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      info: {id: 1, type: FileInfo, required: true}
    errors: [ENOENT, EACCES, ENOTDIR, ENAMETOOLONG, ESTALE]

  - name: Fstat
    id: 22
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
    response:
      info: {id: 1, type: FileInfo, required: true}
    errors: [EBADF]

  - name: Mkdir
    id: 23
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      mode: {id: 2, type: uint32}
    response: Empty
    errors: [EEXIST, ENOENT, EACCES, ENOTDIR, EROFS, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY, EMLINK]

  - name: Rmdir
    id: 24
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response: Empty
    errors: [ENOENT, ENOTEMPTY, ENOTDIR, EACCES, EROFS, ENAMETOOLONG, ESTALE, EBUSY]

  - name: Unlink
    id: 25
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response: Empty
    errors: [ENOENT, EISDIR, EACCES, EROFS, ENAMETOOLONG, ESTALE, EBUSY]

  - name: Rename
    id: 26
    kind: unary
    request:
      from: {id: 1, type: string, required: true}
      to: {id: 2, type: string, required: true}
    response: Empty
    errors: [ENOENT, EEXIST, ENOTEMPTY, EISDIR, ENOTDIR, EXDEV, EACCES, EROFS, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY]

  - name: Symlink
    id: 27
    kind: unary
    request:
      target: {id: 1, type: string, required: true}
      link_path: {id: 2, type: string, required: true}
    response: Empty
    errors: [EEXIST, ENOENT, EACCES, EROFS, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY]

  - name: Readlink
    id: 28
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      target: {id: 1, type: string, required: true}
    errors: [ENOENT, EINVAL, ENAMETOOLONG, ESTALE]

  - name: Link
    id: 29
    kind: unary
    request:
      existing: {id: 1, type: string, required: true}
      new_path: {id: 2, type: string, required: true}
    response: Empty
    errors: [EEXIST, ENOENT, EPERM, EXDEV, EROFS, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY, EMLINK]

  - name: Chmod
    id: 30
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      mode: {id: 2, type: uint32, required: true}
    response: Empty
    errors: [ENOENT, EPERM, EROFS, ENAMETOOLONG, ESTALE, EBUSY]

  - name: Utimens
    id: 31
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      atime_ns: {id: 2, type: int64}
      mtime_ns: {id: 3, type: int64}
      set_atime: {id: 4, type: bool}
      set_mtime: {id: 5, type: bool}
    response: Empty
    errors: [ENOENT, EPERM, EROFS, ENAMETOOLONG, ESTALE, EBUSY]

  - name: Truncate
    id: 32
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      size: {id: 2, type: int64, required: true}
    response: Empty
    errors: [ENOENT, EISDIR, EINVAL, EIO, EFBIG, EROFS, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY]

  - name: Statfs
    id: 33
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      block_size: {id: 1, type: uint32, required: true}
      blocks: {id: 2, type: uint64, required: true}
      blocks_free: {id: 3, type: uint64, required: true}
      blocks_avail: {id: 4, type: uint64, required: true}
      files: {id: 5, type: uint64, required: true}
      files_free: {id: 6, type: uint64, required: true}
      name_max: {id: 7, type: uint32, required: true}
    errors: [ENOENT, EIO, ENAMETOOLONG, ESTALE]

  - name: Access
    id: 34
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      mode: {id: 2, type: uint32, required: true}
    response: Empty
    errors: [ENOENT, EACCES, EROFS, ENAMETOOLONG, ESTALE]

  # Directories
  - name: Opendir
    id: 40
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      handle: {id: 1, type: uint64, required: true}
    errors: [ENOENT, ENOTDIR, EACCES, ENAMETOOLONG, ESTALE]

  - name: Readdir
    id: 41
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
      max_entries: {id: 2, type: uint32, required: true}
    response:
      entries: {id: 1, type: "repeated DirEntry", required: true}
      eof: {id: 2, type: bool, required: true}
    errors: [EBADF, EIO]

  - name: Closedir
    id: 42
    kind: unary
    request:
      handle: {id: 1, type: uint64, required: true}
    response: Empty
    errors: [EBADF]

  # Extensions: one round trip for directory listing with attributes.
  - name: Ls
    id: 43
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      max_entries: {id: 2, type: uint32}
      cursor: {id: 3, type: string}
    response:
      entries: {id: 1, type: "repeated DirEntry", required: true}
      next_cursor: {id: 2, type: string}
    errors: [ENOENT, ENOTDIR, EACCES, EIO, ENAMETOOLONG, ESTALE]
    capability: ls_stat

  # Extensions: bulk operations. Each item carries its own result, so one
  # failure does not abort the batch. Batches are not atomic.
  - name: StatBatch
    id: 50
    kind: unary
    request:
      paths: {id: 1, type: "repeated string", required: true}
    response:
      infos: {id: 1, type: "repeated FileInfo", required: true}
      errors: {id: 2, type: "repeated BatchItemError", required: true}
    capability: bulk_io

  - name: ReadBatch
    id: 51
    kind: data_response
    request:
      handle: {id: 1, type: uint64, required: true}
      ranges: {id: 2, type: "repeated Range", required: true}
    response:
      counts: {id: 1, type: "repeated uint32", required: true}
      errors: {id: 2, type: "repeated BatchItemError", required: true}
    capability: bulk_io

  - name: WriteBatch
    id: 52
    kind: data_request
    request:
      handle: {id: 1, type: uint64, required: true}
      ranges: {id: 2, type: "repeated Range", required: true}
    response:
      counts: {id: 1, type: "repeated uint32", required: true}
      errors: {id: 2, type: "repeated BatchItemError", required: true}
    capability: bulk_io

  - name: ReadFile
    id: 53
    kind: data_response
    request:
      path: {id: 1, type: string, required: true}
      max_bytes: {id: 2, type: uint64}
    response:
      count: {id: 1, type: uint32, required: true}
    errors: [ENOENT, EISDIR, EACCES, EIO, ENAMETOOLONG, ESTALE]
    capability: bulk_io

  - name: WriteFile
    id: 54
    kind: data_request
    request:
      path: {id: 1, type: string, required: true}
      truncate: {id: 2, type: bool}
    response:
      count: {id: 1, type: uint32, required: true}
    errors: [EISDIR, EACCES, EIO, ENOSPC, EROFS, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY]
    capability: bulk_io

  # Deprecated: use RemoveDir. Still served. Recursive removal. Removes children before the parent. Stops at the first
  # error and reports the number of entries removed before it.
  - name: RemoveAll
    id: 55
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      removed: {id: 1, type: uint64, required: true}
    errors: [ENOENT, EACCES, EROFS, EIO, ENAMETOOLONG, ESTALE, EBUSY]
    capability: remove_all

  # Copy and tree operations. Paths are relative to the mount root, under the
  # same length cap and rules as the other path operations. A source with a
  # trailing slash must be a directory, else ENOTDIR. A destination with a
  # trailing slash names a directory. A destination inside the source fails with
  # EINVAL. The root names the mount keeps for itself (.mountOS and the like) are
  # refused: as a destination with EEXIST (as create does), as a source or a
  # removal target with EPERM (as unlink and rename do). A clone moves no data.
  #
  # Clone copies one entry that is not a directory: a file, a symlink, or a
  # special file. It runs to the end before it replies.
  - name: Clone
    id: 56
    kind: unary
    request:
      from: {id: 1, type: string, required: true}
      to: {id: 2, type: string, required: true}
      options: {id: 3, type: CloneOptions}
    response:
      outcome: {id: 1, type: CloneOutcome, required: true}
    errors: [ENOENT, EEXIST, EACCES, EPERM, ENOTDIR, EISDIR, EINVAL, EXDEV, EROFS, EIO, ENOSPC, ENAMETOOLONG, ESTALE, EDQUOT, EBUSY, ELOOP]
    capability: clone

  # Operations. CloneDir and RemoveDir work on a whole tree. They reply at once
  # with an op id, then run in the background. An operation is not a job: the
  # server keeps no record of it after it ends, and there is no status call and
  # no resume. The outcome arrives as notices on the connection that started it,
  # all with ref_id equal to the op id. OP_FAILED arrives once per failing entry,
  # with the path relative to the root of the operation's mount (empty when the
  # name is not valid UTF-8), the code, and a bounded message. The server sends
  # at most 64 OP_FAILED notices per operation. OP_DONE ends the operation. It
  # carries the totals in the count fields, and failed may exceed the OP_FAILED
  # notices sent. After OP_DONE no more notices come for that op id. A server
  # holds a bounded number of running operations per connection and per mount.
  # At the limit the call fails with EAGAIN. The destination of CloneDir is
  # created first and filled from the top, so a partial tree can be seen and
  # used while the operation runs. A failed or cancelled CloneDir leaves what it
  # made. The server aborts the operations of a connection when it closes.
  # Notices can be lost when the client reads too slowly. An OVERFLOW notice with
  # ref_id 0 then means the state of every operation on that connection is unknown.
  # An OVERFLOW notice whose ref_id is an op id means the state of that operation
  # is unknown. Op ids never equal watch ids or warm ids on one connection.
  - name: CloneDir
    id: 57
    kind: unary
    request:
      from: {id: 1, type: string, required: true}
      to: {id: 2, type: string, required: true}
      options: {id: 3, type: CloneOptions}
    response:
      op_id: {id: 1, type: uint64, required: true}
    errors: [ENOENT, EEXIST, EACCES, EPERM, ENOTDIR, EINVAL, EXDEV, EROFS, EAGAIN, ENAMETOOLONG, ESTALE, EBUSY, ELOOP]
    capability: ops

  # RemoveDir removes path and everything below it, children first. It does not
  # stop at the first error: it keeps going and reports each failure.
  - name: RemoveDir
    id: 58
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      op_id: {id: 1, type: uint64, required: true}
    errors: [ENOENT, EACCES, EPERM, ENOTDIR, EINVAL, EROFS, EAGAIN, ENAMETOOLONG, ESTALE, EBUSY]
    capability: ops

  # OpCancel asks a running operation to stop. The operation still ends with an
  # OP_DONE that carries what was done so far. Only the connection that started
  # the operation can cancel it. An unknown or finished op id fails with ENOENT.
  - name: OpCancel
    id: 59
    kind: unary
    request:
      op_id: {id: 1, type: uint64, required: true}
    response: Empty
    errors: [ENOENT]
    capability: ops

  # Watch. The call returns a watch id at once. Changes then arrive as Notice
  # frames (kind CHANGE, ref_id equal to the watch id, with change_kind, path, and
  # old_path) on the same connection, so the caller never polls and needs no
  # separate stream. Unwatch takes the watch id and must be sent on the connection
  # that made the Watch call. Events are not stored. A since_sequence older than the
  # latest notice yields one OVERFLOW notice for the watch, and a watch whose
  # client reads too slowly also gets OVERFLOW, which tells the client to list the
  # path again. The watch ends when its connection closes.
  - name: Watch
    id: 60
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      recursive: {id: 2, type: bool}
      since_sequence: {id: 3, type: uint64}
    response:
      watch_id: {id: 1, type: uint64, required: true}
    errors: [ENOENT, ENOTDIR, EACCES, ENAMETOOLONG, ESTALE]
    capability: watch

  - name: Unwatch
    id: 61
    kind: unary
    request:
      watch_id: {id: 1, type: uint64, required: true}
    response: Empty
    errors: [EBADF]
    capability: watch

  # Warming. WarmOpen and WarmRead return as soon as the server accepts the work
  # and give a warm id. The work runs in the background at low priority. The
  # result arrives later as a Notice frame on the same connection (kind WARM_DONE
  # or WARM_FAILED, ref_id equal to the warm id, with code, message, and path for a
  # failure), so the caller never polls. A path that does not exist is such an
  # asynchronous failure, never an error at the acknowledgement. A full queue is
  # the one immediate failure and returns EAGAIN. WarmOpen warms the file's
  # metadata and leading data. WarmRead warms a byte range, and length 0 means to
  # the end of the file. Warming fills the mount's local cache, so a mount with
  # no local cache (started with --disable-cache-dir) refuses both calls at once
  # with UNSUPPORTED_OPERATION and a message that says why.
  - name: WarmOpen
    id: 70
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
    response:
      warm_id: {id: 1, type: uint64, required: true}
    errors: [EAGAIN, EINVAL, UNSUPPORTED_OPERATION]
    capability: warm

  - name: WarmRead
    id: 71
    kind: unary
    request:
      path: {id: 1, type: string, required: true}
      offset: {id: 2, type: int64}
      length: {id: 3, type: int64}
    response:
      warm_id: {id: 1, type: uint64, required: true}
    errors: [EAGAIN, EINVAL, UNSUPPORTED_OPERATION]
    capability: warm

  # Server-initiated frames: warm results and watch changes. Their frame header
  # carries the notify flag (8) and method 62, and the request id field holds the
  # id of the call the notice answers. A client never sends this method. Notices go
  # only to the connection that made the call, and a notice for a connection that
  # has closed is dropped. The server also sends CLOSING on every connection before
  # it closes them, for example on unmount.
  - name: Notice
    id: 62
    kind: server_push
    request: Empty
    response: Notice
    capability: warm

errorCodes:
  # Protocol errors. Filesystem failures use POSIX names (see errno mapping in each SDK).
  # A server produces 1001, 1002, and 1006. The codes 1003, 1004, 1005, 1007, and 1008
  # are reserved: no server sends them (a server closes the connection instead),
  # and a client must treat an unknown protocol code as a failed call.
  - { code: 1001, name: UNSUPPORTED_VERSION }
  - { code: 1002, name: UNSUPPORTED_OPERATION }
  - { code: 1003, name: SESSION_CLOSED }
  - { code: 1004, name: DEADLINE_EXCEEDED }
  - { code: 1005, name: FRAME_TOO_LARGE }
  - { code: 1006, name: MALFORMED_FRAME }
  - { code: 1007, name: TOO_MANY_INFLIGHT }
  - { code: 1008, name: PERMISSION_DENIED_PEER }
